name: C++ CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
      commit_count: ${{ steps.bump_version.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit count and tag
        id: bump_version
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "new_tag=v1.0.$commit_count" >> "$GITHUB_OUTPUT"
          echo "commit_count=$commit_count" >> "$GITHUB_OUTPUT"

  build-linux:
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DLAB4_VERSION_PATCH=${{ needs.bump-version.outputs.commit_count }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Create DEB package
        working-directory: build
        run: cpack -C ${{ env.BUILD_TYPE }} -G DEB

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ needs.bump-version.outputs.new_tag }}
          path: build/*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: bump-version
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DLAB4_VERSION_PATCH=${{ needs.bump-version.outputs.commit_count }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Create ZIP package
        working-directory: build
        run: cpack -C ${{ env.BUILD_TYPE }} -G ZIP

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ needs.bump-version.outputs.new_tag }}
          path: build/*.zip
          if-no-files-found: error

  create-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [bump-version, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: lab4-release-${{ needs.bump-version.outputs.new_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.bump-version.outputs.new_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" artifacts/linux-package-"$TAG"/*.deb artifacts/windows-package-"$TAG"/*.zip \
            --target "$GITHUB_SHA" --title "Release $TAG" --generate-notes